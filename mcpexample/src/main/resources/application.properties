spring.application.name=mcpexample

# --- Servidor MCP (Spring AI) ---
spring.ai.mcp.server.name=tarea-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

server.port=8088

# --- PostgreSQL ---
# Usuario y clave se leen de variables de entorno (no se guardan en el repo):
#   $env:DB_USER  = "postgres"            (opcional; por defecto postgres)
#   $env:PWD_UDEA = "SU_CLAVE_LOCAL_DE_POSTGRES"
spring.datasource.url=jdbc:postgresql://localhost:5432/tareas_mcp
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# schema.sql se ejecuta a mano (Parte A), no en cada arranque
spring.sql.init.mode=never

logging.file.name=./logs/tareas-mcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
