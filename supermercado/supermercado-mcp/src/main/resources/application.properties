spring.application.name=supermercado-mcp

# --- Servidor MCP (Spring AI, transporte Streamable HTTP) ---
spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# 8089 para convivir con el servidor de tareas del laboratorio (8088)
server.port=8089

# --- PostgreSQL ---
# Usuario y clave por variables de entorno (no se guardan en el repo):
#   $env:DB_USER  = "postgres"   (opcional; por defecto postgres)
#   $env:PWD_UDEA = "SU_CLAVE_LOCAL_DE_POSTGRES"
spring.datasource.url=jdbc:postgresql://localhost:5432/supermercado_mcp
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas; DatosIniciales carga el catálogo si está vacío
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.file.name=./logs/supermercado-mcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
